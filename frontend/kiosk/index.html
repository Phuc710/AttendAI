<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Điểm Danh</title>
  <meta name="description" content="Hệ thống điểm danh tự động bằng nhận diện khuôn mặt AI"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="kiosk.css"/>
</head>
<body>

<!-- ═══ TOPBAR ═══════════════════════════════════════════ -->
<header class="topbar" id="topbar">
  <div class="topbar-left">
    <div>
      <div class="logo-title">AttendAI</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<!-- ═══ MAIN LAYOUT ═════════════════════════════════════ -->
<main class="kiosk-main">

  <!-- ── Camera Panel (LEFT) ─────────────────────────── -->
  <section class="cam-section">
    <div class="cam-frame" id="camFrame">
      <img id="camImg" src="/api/camera/stream" alt="Camera Stream"/>
      <canvas id="bboxCanvas"></canvas>

      <!-- Overlay: waiting -->
      <div class="cam-waiting" id="camWaiting">
        <div class="cam-waiting-icon">📷</div>
        <p style="font-weight:900; font-size:1.5rem; letter-spacing: 2px;">CAMERA OFFLINE</p>
        <div class="cam-waiting-dots"><span></span><span></span><span></span></div>
      </div>

    </div>
  </section>

  <!-- ── Attendance Panel (RIGHT) ────────────────────── -->
  <aside class="att-panel">



    <!-- Divider -->
    <div class="att-divider">
      <span class="att-divider-line"></span>
      <span class="att-divider-text">Lịch sử hôm nay</span>
      <span class="att-divider-line"></span>
    </div>

    <!-- Check-in list -->
    <div class="att-list-header">
      <span>Đã điểm danh</span>
      <span class="att-count" id="attCount">0</span>
    </div>
    <div class="att-list" id="attList">
      <div class="att-empty" id="attEmpty">Chưa có ai điểm danh</div>
    </div>
  </aside>

</main>

<!-- ═══ TOAST ═══════════════════════════════════════════ -->
<div class="toast" id="toast"></div>

<script src="kiosk.js"></script>
</body>
</html>
